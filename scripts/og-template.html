<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(INTERFONT) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Inter,sans-serif;color:#F3F5FA;
background:radial-gradient(900px 500px at 85% -10%,rgba(91,140,255,.28),transparent 70%),radial-gradient(700px 420px at -5% 110%,rgba(167,139,250,.22),transparent 70%),#0B1020;
padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
body:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px}
.mark{position:relative;width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#5B8CFF,#A78BFA);display:grid;place-items:center;color:#0B1020;font-weight:800;font-size:30px;letter-spacing:-1px}
.name{position:relative;font-size:96px;font-weight:720;letter-spacing:-4px;line-height:1}
.roles{position:relative;margin-top:26px;font-size:34px;font-weight:550;color:#B0BACB;letter-spacing:-.5px}
.roles b{color:#A78BFA;font-weight:300;margin:0 14px}
.foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:#8490A5}
.foot span{color:#7AA2FF}
</style></head><body>
<div class="mark">KG</div>
<div><div class="name">Karan Gadekar</div>
<div class="roles">Data Engineer Associate<b>|</b>Developer<b>|</b>Entrepreneur</div></div>
<div class="foot"><div>Data engineering and business intelligence portfolio</div></div>
</body></html>
